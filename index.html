<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover puts the canvas under a notch and hands the insets to
      CSS as env(safe-area-inset-*), which is where the touch controls place
      themselves. The scale is pinned because every gesture in the game is one
      the page wants: without this, a two-thumb burst reads as a pinch zoom.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      Added to a home screen, the page runs without the browser's toolbars —
      which on an iPhone is the *only* way to get a full screen, since Safari
      there has no Fullscreen API at all. The apple-* tags are what iOS reads;
      the manifest is what everything else reads. The touch layer offers this to
      the player, see TouchControls.renderInstallOffer.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Forbidden City" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#cfe9f2" />
    <meta
      name="description"
      content="A hand-drawn paintball game. Nobody dies. Everyone gets messy."
    />
    <title>Forbidden City Paintball</title>
    <!--
      The loading card is inlined so it paints on the first pass, before any
      module is fetched. Everything here is deliberately styleable without a
      stylesheet request — see the load budget in PLAN.md.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #cfe9f2;
        font-family: ui-rounded, "Segoe UI Rounded", "Hiragino Maru Gothic ProN",
          system-ui, -apple-system, sans-serif;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        background: linear-gradient(170deg, #eaf6fb 0%, #cfe9f2 45%, #b9dcc6 100%);
        color: #2a2438;
        transition: opacity 0.5s ease;
      }
      #loader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #loader h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: center;
      }
      #loader p {
        margin: -0.5rem 0 0;
        opacity: 0.7;
        font-size: 0.95rem;
        text-align: center;
      }
      #loader-track {
        width: min(320px, 70vw);
        height: 10px;
        border: 2px solid #2a2438;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.5);
      }
      #loader-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff3d81, #ffd23f, #00d4e8);
        transition: width 0.3s ease;
      }
      #loader-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        opacity: 0.55;
        min-height: 1em;
      }
      /*
        Shared with the end-of-round and pause cards — see the note in
        src/style.css. Sized to be found rather than to be tidy: this is the
        one link on the page and it was previously a footnote, so it now
        carries the game's yellow, a proper button's weight, and a slow nudge
        that catches the eye without ever being in the way.
      */
      .fork-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 11px 22px;
        border: 3px solid #2a2438;
        border-radius: 999px;
        background: #ffd23f;
        color: #2a2438;
        font-size: 0.92rem;
        font-weight: 800;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        box-shadow: 0 4px 0 rgba(42, 36, 56, 0.3);
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        animation: fork-nudge 6s ease-in-out 2s infinite;
      }
      .fork-badge:hover {
        transform: translateY(-2px) rotate(-1.5deg);
        background: #ffdf6e;
        box-shadow: 0 7px 0 rgba(42, 36, 56, 0.3);
        animation: none;
      }
      .fork-badge:active {
        transform: translateY(1px);
        box-shadow: 0 2px 0 rgba(42, 36, 56, 0.3);
      }
      .fork-badge svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      /* A wobble, not a throb: it should read as hand-drawn, not as an advert. */
      @keyframes fork-nudge {
        0%, 88%, 100% { transform: rotate(0deg); }
        91% { transform: rotate(-3deg) scale(1.04); }
        95% { transform: rotate(3deg) scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        .fork-badge { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loader">
      <h1>Forbidden City Paintball</h1>
      <p>Nobody dies. Everyone gets messy.</p>
      <div id="loader-track"><div id="loader-bar"></div></div>
      <div id="loader-label">starting</div>
      <a
        class="fork-badge"
        href="https://github.com/raimanx/forbidden-city-paintball"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
          />
        </svg>
        Fork me on GitHub
      </a>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
